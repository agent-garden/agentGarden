# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

env:
  # Verified emails that become admins on first sign-in (comma-separated).
  # Server-only; never exposed to the browser.
  - variable: ADMIN_EMAILS
    value: w3develops@gmail.com
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://agentgarden.org
    availability:
      - BUILD
      - RUNTIME
  # Solana Web3 escrow configuration
  - variable: NEXT_PUBLIC_SOLANA_CLUSTER
    value: devnet
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SOLANA_TREASURY
    value: 2tv82Z7DaAtJE2HctmajcWA86Tno1LFMvxoiYfLgkVbx
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SOLANA_PROGRAM_ID
    value: EMfkXhVANcoRC2u9Ti2j6W7zkCd7PhtZCNa8eLkAYyXZ
    availability:
      - BUILD
      - RUNTIME
  # Jev by TypeSafe AI: search re-ranking and the new-agent security check.
  - variable: TYPESAFE_API_KEY
    secret: TYPESAFE_API_KEY
    availability:
      - RUNTIME
  # Gemini: embeddings for search fingerprints and memory sync.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
